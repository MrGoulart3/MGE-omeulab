<html lang="pt-BR"><head><meta charset="utf-8">

<style>
:root{
  --bg:#f6f4ef; --paper:#fffdf8; --ink:#16202c; --ink2:#465364; --muted:#586473;
  --line:#8b8478; --accent:#c2611f; --accent-ink:#9a4a12; --accent-soft:#f6e3d3;
  --navy:#1d3a5c; --navy-soft:#e4ebf3; --pend:#8a5a00; --pend-bg:#fff2cc;
  --curve:#1d3a5c; --grid:#e7e2d8;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161e; --paper:#161e28; --ink:#e9e6df; --ink2:#b5bdc8; --muted:#8a94a2;
  --line:#617084; --accent:#e8894a; --accent-ink:#f0a46f; --accent-soft:#3a2617;
  --navy:#8fb3da; --navy-soft:#1c2a3a; --pend:#ffd27a; --pend-bg:#3b2f12;
  --curve:#8fb3da; --grid:#222c38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161e; --paper:#161e28; --ink:#e9e6df; --ink2:#b5bdc8; --muted:#8a94a2;
  --line:#617084; --accent:#e8894a; --accent-ink:#f0a46f; --accent-soft:#3a2617;
  --navy:#8fb3da; --navy-soft:#1c2a3a; --pend:#ffd27a; --pend-bg:#3b2f12;
  --curve:#8fb3da; --grid:#222c38; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
html[data-lang="pt"] [lang="en"], html[data-lang="en"] [lang="pt"]{display:none!important}
a{color:var(--accent-ink);text-underline-offset:3px}
h1,h2,h3{font-family:Fraunces,Georgia,"Times New Roman",serif;line-height:1.15;text-wrap:balance;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px}
/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:16px;min-height:60px}
.brand{font-family:Fraunces,serif;font-weight:700;font-size:1.15rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand b{color:var(--accent-ink);font-weight:700}
.links{display:flex;gap:12px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.links a{color:var(--ink2);text-decoration:none;font-size:.92rem;white-space:nowrap}
.links a:hover{color:var(--accent-ink)}
.tools{display:flex;gap:6px}
.tools button{font:500 .78rem "IBM Plex Mono",monospace;background:transparent;border:1px solid var(--line);color:var(--ink2);border-radius:6px;padding:5px 8px;cursor:pointer}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.menu-toggle{display:none;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer}
@media (max-width:860px){
  html{scroll-padding-top:10rem}
  .nav .wrap{flex-wrap:wrap;gap:10px;padding-block:8px}
  .brand{margin-right:auto}.tools{margin-left:0}
  .links{order:4;flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px 16px;margin:0;padding:8px 0}
  .js .menu-toggle{display:inline-flex}
  .js .links{display:none}
  .js .links[data-open="true"]{display:flex}
}
@media (min-width:861px){.links{display:flex!important}}
/* hero */
.hero{padding-block:56px 40px}
.hero .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.kicker{font:500 .78rem "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.hero h1{font-size:clamp(2.2rem,5vw,3.4rem);margin:10px 0 14px}
.hero p.lead{font-size:1.12rem;color:var(--ink2);max-width:34em;margin:0 0 22px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;font-weight:600;font-size:.95rem;text-decoration:none;border:1px solid var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ghost{color:var(--ink)}
.profile{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 10px}
.profile svg{width:100%;height:auto;display:block}
.profile figcaption{font-size:.82rem;color:var(--muted);padding-top:6px}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.hero{padding-block:32px 24px}}
/* sections */
section.block{padding-block:56px;border-top:1px solid var(--line)}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.head h2{font-size:clamp(1.6rem,3.4vw,2.2rem)}
.head .num{font:500 .8rem "IBM Plex Mono",monospace;color:var(--muted)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:860px){.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.card h3{font-size:1.15rem;margin-bottom:6px}
.card p{margin:0;color:var(--ink2)}
.tag{display:inline-block;font:500 .72rem "IBM Plex Mono",monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--navy);background:var(--navy-soft);padding:3px 8px;border-radius:4px;margin-bottom:10px}
.tag.hot{color:var(--accent-ink);background:var(--accent-soft)}
.pend{display:inline-block;font:500 .7rem "IBM Plex Mono",monospace;color:var(--pend);background:var(--pend-bg);border:1px dashed var(--pend);padding:1px 6px;border-radius:4px;vertical-align:middle;margin-left:4px}
html.nopend .pend{display:none}
/* publications */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.filters button{font:500 .85rem "IBM Plex Sans",sans-serif;border:1px solid var(--line);background:var(--paper);color:var(--ink2);padding:6px 12px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.pubs{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.pub{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px}
.pub .yr{font:600 1.05rem "IBM Plex Mono",monospace;color:var(--accent-ink)}
.pub .kind{display:block;font:500 .68rem "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:2px}
.pub .t{font-weight:600;line-height:1.4}
.pub .a{font-size:.9rem;color:var(--ink2);margin-top:4px}
.pub .a b{color:var(--ink)}
.pub .v{font-size:.85rem;color:var(--muted);margin-top:2px}
.pub .award{display:inline-block;margin-top:8px;font-size:.82rem;font-weight:600;color:var(--accent-ink)}
@media (max-width:520px){.pub{grid-template-columns:1fr;gap:4px}}
/* timeline */
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--line);display:grid;gap:22px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--navy)}
.tl li.now::before{background:var(--accent);border-color:var(--accent)}
.tl .when{font:500 .8rem "IBM Plex Mono",monospace;color:var(--muted)}
.tl .what{font-weight:600}
.tl .where{color:var(--ink2);font-size:.95rem}
/* media */
.video{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:center}
.thumb{position:relative;display:block;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;inset:auto 12px 12px auto;background:var(--accent-ink);color:var(--paper);font-weight:600;font-size:.85rem;padding:6px 10px;border-radius:6px}
@media (max-width:860px){.video{grid-template-columns:1fr}}
details.gl{border-bottom:1px solid var(--line);padding:10px 0}
details.gl summary{cursor:pointer;font-weight:600}
details.gl p{margin:8px 0 0;color:var(--ink2)}
.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.list li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--line);padding-bottom:6px}
.list li span:last-child{color:var(--muted);font-size:.88rem;text-align:right}
/* contact */
.socials{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.social{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;text-decoration:none;color:var(--ink);min-width:0}
.social .ic{flex:none;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--navy-soft);color:var(--navy);font:600 .8rem "IBM Plex Mono",monospace}
.social small{display:block;color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.social.todo{border-style:dashed}
.copy{font:inherit;font-size:.8rem;border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:6px;padding:2px 8px;cursor:pointer;margin-left:auto}
footer{padding-block:32px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.preview{background:var(--pend-bg);color:var(--pend);font-size:.85rem;text-align:center;padding:8px 16px;border-bottom:1px dashed var(--pend)}
.preview button{font:inherit;font-weight:600;color:inherit;background:none;border:0;text-decoration:underline;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:4px}
a,button,summary{touch-action:manipulation}
.tools button,.filters button,.copy{min-height:44px}
.skip-link{position:absolute;left:16px;top:8px;transform:translateY(-180%);z-index:20;background:var(--paper);color:var(--ink);padding:10px 16px;border:2px solid var(--ink)}
.skip-link:focus{position:fixed;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}

.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--paper);box-shadow:0 0 0 1px var(--line);display:block;margin-bottom:16px}
.profile.mol{padding:10px 14px 12px;position:relative}
#mol3d{width:100%;height:auto;aspect-ratio:520/420;display:block;cursor:grab;touch-action:pan-y}
#mol3d:active{cursor:grabbing}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);padding:4px 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
h3.sub{font-size:1.15rem;margin:34px 0 14px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.person{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.person img,.person .ph{flex:none;width:64px;height:64px;border-radius:50%;object-fit:cover}
.person .ph{display:grid;place-items:center;background:var(--navy-soft);color:var(--navy);font-weight:600}
.person small{display:block;color:var(--muted);font-size:.82rem}
.cardimg{width:calc(100% + 40px);max-width:none;margin:-20px -20px 14px;height:180px;object-fit:cover;border-radius:12px 12px 0 0;display:block}
:root{--at-C:#3d4652;--at-H:#e8e6e1;--at-N:#3b6fd4;--at-O:#d8452f;--at-S:#e2b62a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--at-C:#9aa5b4;--at-H:#f2f0ea}}
:root[data-theme="dark"]{--at-C:#9aa5b4;--at-H:#f2f0ea}

.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin:4px 0 22px}
.gallery figure{margin:0;min-width:0}
.gallery img{width:100%;height:280px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.gallery figcaption{font-size:.82rem;color:var(--muted);padding-top:6px}
@media (max-width:860px){.gallery{grid-template-columns:1fr 1fr}.gallery .span2{grid-column:1/-1}.gallery img{height:220px}}
